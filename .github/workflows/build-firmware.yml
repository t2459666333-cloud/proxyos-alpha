name: build-firmware

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential curl jq zstd python3-yaml
      - name: Run project checks
        run: npm test && npm run check
      - name: Run portable hardware detection checks
        run: bash ./tests/run-hardware-detection-test.sh
      - name: Run controller integration checks
        run: |
          curl --fail --location --retry 3 \
            https://github.com/SagerNet/sing-box/releases/download/v1.12.17/sing-box-1.12.17-linux-amd64.tar.gz \
            --output /tmp/sing-box.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          PROXYOS_SINGBOX=/tmp/sing-box-1.12.17-linux-amd64/sing-box \
            bash ./tests/run-controller-test.sh
      - name: Build images
        run: bash ./scripts/build-image.sh
      - name: Verify boot images and checksums
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          for archive in ./*.img.gz; do
            gzip -t "$archive"
            image="/tmp/$(basename "${archive%.gz}")"
            gzip -dc "$archive" > "$image"
            node ../tools/verify-image.mjs "$image"
            rm -f "$image"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: proxyos-alpha-x86_64
          path: dist/*
          if-no-files-found: error
