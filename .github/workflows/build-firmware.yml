name: build-firmware

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential curl zstd
      - name: Run project checks
        run: npm test && npm run check
      - name: Build images
        run: bash ./scripts/build-image.sh
      - uses: actions/upload-artifact@v4
        with:
          name: proxyos-alpha-x86_64
          path: dist/*
          if-no-files-found: error
